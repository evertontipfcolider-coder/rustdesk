name: Custom Windows Client Generator

on: 
  workflow_dispatch:
  push:
    paths:
      - 'config.txt'

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  FLUTTER_ELINUX_VERSION: "3.16.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.9"
  UPLOAD_ARTIFACT: 'true'
  
  appname: "Suporte"
  filename: "Suporte-TI"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    secrets: inherit

  build-for-windows-flutter:
    name: Build Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              vcpkg-triplet: x64-windows-static,
            }
    steps:
      - name: Checkout Custom Repository (Assets & Config)
        uses: actions/checkout@v4
        with:
          path: custom_repo

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Parse Configuration File (config.txt)
        shell: pwsh
        run: |
          $configFile = "custom_repo/config.txt"
          if (Test-Path $configFile) {
            Get-Content $configFile | ForEach-Object {
              if ($_ -and -not $_.StartsWith("#")) {
                $pair = $_.Split("=", 2)
                if ($pair.Length -eq 2) {
                  $key = $pair[0].Trim()
                  $value = $pair[1].Trim()
                  Write-Output "$key=$value" >> $env:GITHUB_ENV
                }
              }
            }
          } else {
            Write-Error "Arquivo config.txt nao encontrado no repositorio!"
            exit 1
          }

      - name: Save Repository Assets
        shell: pwsh
        run: |
          mkdir C:\temp_assets -ErrorAction SilentlyContinue
          if (Test-Path "custom_repo/.github/assets/icone.png") { cp "custom_repo/.github/assets/icone.png" C:\temp_assets\icone.png }
          if (Test-Path "custom_repo/.github/assets/logo.png") { cp "custom_repo/.github/assets/logo.png" C:\temp_assets\logo.png }

      - name: Checkout RustDesk Source
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install ImageMagick on Windows
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Process App Icons for Windows Runner
        shell: pwsh
        run: |
          if (Test-Path "C:\temp_assets\icone.png") {
            magick C:\temp_assets\icone.png -define icon:auto-resize=256,64,48,32,16 ./res/icon.ico
            cp ./res/icon.ico ./res/tray-icon.ico
            cp ./res/icon.ico ./flutter/windows/runner/resources/app_icon.ico
            
            magick C:\temp_assets\icone.png -resize 32x32 ./res/32x32.png
            magick C:\temp_assets\icone.png -resize 64x64 ./res/64x64.png
            magick C:\temp_assets\icone.png -resize 128x128 ./res/128x128.png
            magick C:\temp_assets\icone.png -resize 128x128 ./res/128x128@2x.png
          }

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          $VCPKG_ROOT/vcpkg install --triplet ${{ matrix.job.vcpkg-triplet }} --x-install-root="$VCPKG_ROOT/installed"
        shell: bash

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk 
          
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath . -Force
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Process Custom App Logo
        shell: pwsh
        run: |
          if (Test-Path "C:\temp_assets\logo.png") {
            cp "C:\temp_assets\logo.png" ./rustdesk/data/flutter_assets/assets/logo.png
          }

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: topmostwindow-artifacts
          path: "./rustdesk"

      - name: Inject Custom Settings from config.txt
        shell: pwsh
        run: |
          $servidor = "${{ env.SERVER }}"
          $key = "${{ env.KEY }}"
          $senha = "${{ env.PASSWORD }}"

          $configLines = @(
              "custom-rendezvous-server=$servidor",
              "host=$servidor",
              "relay-server=$servidor",
              "api-server=http://$servidor`:21114",
              "key=$key",
              "permanent-password=$senha",
              "is-incoming-only=true"
          )
          
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllLines("$PWD\rustdesk\custom_.txt", $configLines, $utf8NoBom)
          [System.IO.File]::WriteAllLines("$PWD\libs\portable\custom_.txt", $configLines, $utf8NoBom)

      - name: Build self-extracted executable
        shell: bash
        run: |
          mv "./rustdesk/rustdesk.exe" "./rustdesk/${{ env.appname }}.exe" || echo "ok"
          sed -i '/dpiAware/d' res/manifest.xml
          
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${{ env.appname }}.exe"
          popd
          
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/${{ env.filename }}.exe"

      - name: Upload Binary Result
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: ./SignOutput/*.exe
