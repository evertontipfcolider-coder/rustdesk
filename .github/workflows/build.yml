name: Gerar RustDesk Customizado

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Baixar RustDesk Oficial
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe" -OutFile "rustdesk-original.exe"

      - name: Baixar Resource Hacker
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://www.angusj.com/resourcehacker/resource_hacker.zip" -OutFile "rh.zip"
          Expand-Archive -Path "rh.zip" -DestinationPath "rh"

      - name: Criar arquivo de configuração
        shell: powershell
        run: |
          $jsonConfig = @'
          {
            "platform": "windows",
            "version": "1.4.9",
            "exename": "Suporte",
            "appname": "Suporte",
            "direction": "incoming",
            "serverIP": "terer.com",
            "key": "keyyyyyyyyyyyyyyyyyyyyyyyy",
            "urlLink": "rustdesk.com",
            "downloadLink": "rustdesk.com/download",
            "passApproveMode": "password-click",
            "permanentPassword": "Abc@1234",
            "enableDirectIP": "on"
          }
          '@
          [System.IO.File]::WriteAllText("config.json", $jsonConfig, [System.Text.Encoding]::UTF8)

      - name: Injetar Configurações no Executável
        shell: cmd
        run: |
          :: Forçando caminhos absolutos com %CD% para garantir que o Resource Hacker encontre os arquivos
          .\rh\ResourceHacker.exe -open "%CD%\rustdesk-original.exe" -save "%CD%\rustdesk-custom.exe" -action addoverwrite -res "%CD%\config.json" -mask RCData,CONFIG,

      - name: Verificar se o arquivo foi criado (Debug)
        shell: cmd
        run: |
          dir

      - name: Upload do Executável Customizado
        uses: actions/upload-artifact@v5
        with:
          name: Suporte-RustDesk
          path: rustdesk-custom.exe
          if-no-files-found: error
