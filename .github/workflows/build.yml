name: Custom Windows Client Generator

on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do RustDesk para compilar (ex: 1.4.9 ou master)'
        required: true
        default: '1.4.9'
        type: string
      servidor:
        description: 'Endereço do seu Servidor de ID (ex: terer.com)'
        required: true
        type: string
      key:
        description: 'Chave Pública do Servidor (Key)'
        required: true
        type: string
      senha:
        description: 'Senha Permanente Padrão'
        required: true
        type: string
      icone:
        description: 'Caminho do ícone no repositório'
        required: false
        default: '.github/assets/icone.png'
        type: string
      logo:
        description: 'Caminho da logo no repositório'
        required: false
        default: '.github/assets/logo.png'
        type: string

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  FLUTTER_ELINUX_VERSION: "3.16.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "${{ inputs.version }}"
  UPLOAD_ARTIFACT: 'true'
  
  server: "${{ inputs.servidor }}"
  key: "${{ inputs.key }}"
  appname: "RustDesk"
  filename: "rustdesk-custom"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    secrets: inherit

  build-for-windows-flutter:
    name: Build Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              vcpkg-triplet: x64-windows-static,
            }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Save Repository Assets to Memory
        shell: pwsh
        run: |
          mkdir C:\temp_assets -ErrorAction SilentlyContinue
          if (Test-Path "${{ inputs.icone }}") { cp "${{ inputs.icone }}" C:\temp_assets\icone.png }
          if (Test-Path "${{ inputs.logo }}") { cp "${{ inputs.logo }}" C:\temp_assets\logo.png }

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install ImageMagick on Windows
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: fix flutter_gpu_texture_renderer
        shell: bash
        run: |
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.lock
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.yaml

      - name: Inject Custom Server, Key and Mode into Code
        shell: bash
        run: |
          # 1. Injeta Servidor e Key nas configurações nativas do Rust
          find libs/ -name "config.rs" -exec sed -i 's|rs-ny.rustdesk.com|${{ env.server }}|g' {} +
          find libs/ -name "config.rs" -exec sed -i 's|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|${{ env.key }}|g' {} +
          find src/ -name "*.rs" -exec sed -i 's|rs-ny.rustdesk.com|${{ env.server }}|g' {} +
          find src/ -name "*.rs" -exec sed -i 's|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|${{ env.key }}|g' {} +

          # 2. Força o modo Custom / Client-Only no código fonte
          sed -i 's|pub static ref IS_CUSTOM: bool = false;|pub static ref IS_CUSTOM: bool = true;|g' src/common.rs || true
          sed -i 's|pub static ref IS_INCOMING_ONLY: bool = false;|pub static ref IS_INCOMING_ONLY: bool = true;|g' src/common.rs || true

      - name: Process Custom App Icon
        shell: pwsh
        run: |
          if (Test-Path "C:\temp_assets\icone.png") {
            cp "C:\temp_assets\icone.png" ./res/icon.png
            magick ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/icon.ico
            cp ./res/icon.ico ./res/tray-icon.ico
            magick ./res/icon.png -resize 32x32 ./res/32x32.png
            magick ./res/icon.png -resize 64x64 ./res/64x64.png
            magick ./res/icon.png -resize 128x128 ./res/128x128.png
            magick ./res/128x128.png -resize 200% ./res/128x128@2x.png
          }

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          $VCPKG_ROOT/vcpkg install --triplet ${{ matrix.job.vcpkg-triplet }} --x-install-root="$VCPKG_ROOT/installed"
        shell: bash

      - name: Build rustdesk
        run: |
          # Passamos a flag --custom para instruir o build a compilar a versão cliente customizada
          python3 .\build.py --portable --hwcodec --flutter --vram --custom --skip-portable-pack
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk 
          
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath . -Force
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Process Custom App Logo
        shell: pwsh
        run: |
          if (Test-Path "C:\temp_assets\logo.png") {
            cp "C:\temp_assets\logo.png" ./rustdesk/data/flutter_assets/assets/logo.png
          }

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: topmostwindow-artifacts
          path: "./rustdesk"

      - name: Build Portable Client Package with Injected Configs
        shell: pwsh
        run: |
          # 1. Prepara a string de configuração codificada
          $server = "${{ inputs.servidor }}"
          $key = "${{ inputs.key }}"
          $senha = "${{ inputs.senha }}"

          $configStr = "host=$server,key=$key,pw=$senha"
          
          # 2. Injeta no arquivo custom_.txt dentro do diretório do portátil
          $customTxtPath = "./rustdesk/custom_.txt"
          Set-Content -Path $customTxtPath -Value "host=$server`nkey=$key`npw=$senha`nrendezvous_server=$server`n" -Encoding UTF8

          # 3. Empacota o executável portátil
          mv "./rustdesk/rustdesk.exe" "./rustdesk/${{ env.appname }}.exe" -ErrorAction SilentlyContinue
          sed -i '/dpiAware/d' res/manifest.xml
          
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${{ env.appname }}.exe"
          popd
          
          mkdir -p ./SignOutput
          
          # Renomeia o executável gerado injetando a string de servidor no nome base se necessário para o gerador
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/${{ env.filename }}.exe"

      - name: Upload Binary Result
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: ./SignOutput/*.exe
