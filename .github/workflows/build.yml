name: Gerar RustDesk Customizado

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Baixar RustDesk Oficial
        shell: powershell
        run: |
          # Baixa a versão estável do RustDesk
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe" -OutFile "rustdesk-original.exe"

      - name: Baixar Resource Hacker
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://www.angusj.com/resourcehacker/resource_hacker.zip" -OutFile "rh.zip"
          Expand-Archive -Path "rh.zip" -DestinationPath "rh"

      - name: Criar arquivo de configuração
        shell: powershell
        run: |
          $jsonConfig = @'
          {
            "platform": "windows",
            "version": "1.4.9",
            "exename": "Suporte",
            "appname": "Suporte",
            "direction": "incoming",
            "serverIP": "terer.com",
            "key": "keyyyyyyyyyyyyyyyyyyyyyyyy",
            "urlLink": "rustdesk.com",
            "downloadLink": "rustdesk.com/download",
            "passApproveMode": "password-click",
            "permanentPassword": "Abc@1234",
            "enableDirectIP": "on"
          }
          '@
          # Salvando com encoding estrito para evitar quebras de caracteres no binário
          [System.IO.File]::WriteAllText("config.json", $jsonConfig, [System.Text.Encoding]::UTF8)

      - name: Injetar Configurações no Executável
        shell: cmd
        run: |
          :: Usando a sintaxe estrita de script do Resource Hacker para garantir a criação do arquivo
          echo [FILENAMES] > rh_script.txt
          echo Exe=rustdesk-original.exe >> rh_script.txt
          echo SaveAs=rustdesk-custom.exe >> rh_script.txt
          echo [COMMANDS] >> rh_script.txt
          echo -addoverwrite config.json, RCData, CONFIG, >> rh_script.txt
          
          .\rh\ResourceHacker.exe -script rh_script.txt

      - name: Upload do Executável Customizado
        uses: actions/upload-artifact@v4
        with:
          name: Suporte-RustDesk
          path: rustdesk-custom.exe
