name: Build Custom RustDesk Client

on:
  workflow_dispatch: # Permite que você clique em "Run workflow" manualmente no GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Official RustDesk Client
        run: |
          # Baixa a versão estável 1.4.9 (ou a que você preferir)
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.4.9/rustdesk-1.4.9-x86_64.exe" -OutFile "rustdesk-orig.exe"

      - name: Generate Config String and Rename Executable
        shell: pwsh
        run: |
          # Seus parâmetros reais de configuração
          $server = "rd.colider.abrachamado.com.br"
          $key = "oKGLwFMmK9BN3Xp4P5wUTmLi17VlNla4i0SMnqyCH9U="
          $name = "Suporte"

          # Cria a string de configuração que o RustDesk aceita embutida no nome do arquivo
          # Formato: rustdesk-host=<host>,key=<key>.exe
          $configStr = "rustdesk-host=$server,key=$key.exe"
          
          # Renomeia o executável original para o formato que aplica as configurações automaticamente
          Rename-Item -Path "rustdesk-orig.exe" -NewName $configStr
          
          # Copia ou move com o nome amigável final que você quer ("Suporte.exe")
          # Nota: O RustDesk lê as configurações embutidas se o usuário final mantiver a string, 
          # ou se o script de instalação ler esse arquivo modificado.
          Copy-Item -Path $configStr -Destination "$name.exe"

      - name: Upload Custom Executable
        uses: actions/upload-artifact@v4
        with:
          name: Suporte-Custom-Client
          path: Suporte.exe
